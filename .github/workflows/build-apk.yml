name: Build Study with Love APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare permanent APK signing key
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        shell: bash
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/study-with-love.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/study-with-love.jks" >> "$GITHUB_ENV"

      - name: Warn when permanent signing is not configured
        if: ${{ env.ANDROID_KEYSTORE_BASE64 == '' }}
        run: echo "::warning::Permanent signing is not configured; this APK uses the temporary runner debug key."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate question bank
        run: python scripts/validate_question_bank.py

      - name: Check Cloudflare Worker syntax and config
        run: |
          node --check cloudflare/ai-worker.js
          python -c "import tomllib; tomllib.load(open('cloudflare/wrangler.toml', 'rb'))"

      - name: Run Android Lint
        run: gradle --no-daemon lintDebug

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Study-with-Love-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
