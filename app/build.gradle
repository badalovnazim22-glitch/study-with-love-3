plugins { id 'com.android.application' }

def stableSigningConfigured = System.getenv("ANDROID_KEYSTORE_PATH") &&
        System.getenv("ANDROID_KEYSTORE_PASSWORD") &&
        System.getenv("ANDROID_KEY_ALIAS") &&
        System.getenv("ANDROID_KEY_PASSWORD")

android {
    namespace 'com.studywithlove.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.studywithlove.app'
        minSdk 23
        targetSdk 35
        versionCode 10
        versionName '4.1'
    }

    signingConfigs {
        if (stableSigningConfigured) {
            stableDebug {
                storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            if (stableSigningConfigured) {
                signingConfig signingConfigs.getByName("stableDebug")
            }
        }
    }
}


def ambienceResDir = layout.buildDirectory.dir("generated/ambienceRes")
android.sourceSets.main.res.srcDir(ambienceResDir)

tasks.register("downloadAmbienceAssets") {
    outputs.files(
        ambienceResDir.map { it.file("raw/ambience_rain.ogg") },
        ambienceResDir.map { it.file("raw/ambience_cafe.ogg") },
        ambienceResDir.map { it.file("raw/ambience_forest.ogg") },
        ambienceResDir.map { it.file("raw/ambience_library.ogg") }
    )
    doLast {
        def rawDir = file("$buildDir/generated/ambienceRes/raw")
        rawDir.mkdirs()
        def sounds = [
            ambience_rain: "https://upload.wikimedia.org/wikipedia/commons/3/3d/Rain.ogg",
            ambience_cafe: "https://upload.wikimedia.org/wikipedia/commons/5/54/Cafe_ambiance.ogg",
            ambience_forest: "https://upload.wikimedia.org/wikipedia/commons/3/38/Birds_forest.ogg",
            ambience_library: "https://upload.wikimedia.org/wikipedia/commons/f/fb/20121112_TU_Delft_Library%2C_quiet_study_room_-_general_ambience_-_SoundCloud_-_el_mar.ogg"
        ]
        sounds.each { name, url ->
            def output = new File(rawDir, name + ".ogg")
            if (!output.exists() || output.length() < 10000) {
                def connection = new URL(url).openConnection()
                connection.setConnectTimeout(20000)
                connection.setReadTimeout(120000)
                connection.setRequestProperty("User-Agent", "StudyWithLove Android build/1.0")
                connection.getInputStream().withCloseable { input ->
                    output.withOutputStream { out -> out << input }
                }
            }
        }
    }
}
tasks.named("preBuild").configure { dependsOn("downloadAmbienceAssets") }
