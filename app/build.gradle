plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

def stableSigningConfigured = System.getenv("ANDROID_KEYSTORE_PATH") &&
        System.getenv("ANDROID_KEYSTORE_PASSWORD") &&
        System.getenv("ANDROID_KEY_ALIAS") &&
        System.getenv("ANDROID_KEY_PASSWORD")

android {
    namespace 'com.studywithlove.app'
    compileSdk 35
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    defaultConfig {
        applicationId 'com.studywithlove.app'
        minSdk 23
        targetSdk 35
        versionCode 209
        versionName '5.100'
        // UI update: compact atmosphere volume and timer controls
        // Compile fix: updater progress label
    }

    signingConfigs {
        if (stableSigningConfigured) {
            stableDebug {
                storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            if (stableSigningConfigured) {
                signingConfig signingConfigs.getByName("stableDebug")
            }
        }
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.9.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'androidx.core:core:1.15.0'

    // Motion and visual effects
    implementation 'com.airbnb.android:lottie:6.7.1'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.1.0'
    implementation 'com.facebook.shimmer:shimmer:0.5.0'

    // Material components and image loading
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
